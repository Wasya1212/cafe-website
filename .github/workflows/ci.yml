name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Test & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present

      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to Creator
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          CREATOR_USER_TOKEN: ${{ secrets.CREATOR_USER_TOKEN }}
          CREATOR_API_URL: 'https://creator.qa.api.onereach.ai/v1/versions'
          CREATOR_PROJECT_ID: 'bd65c3c8-d0f9-412a-9f61-9143a91bc984'
          COMMIT_SHA: ${{ github.sha }}
          CREATOR_GIT_PROVIDER: 'github'
        run: node creator-deploy.cjs